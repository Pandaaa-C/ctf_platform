services:
  db:
    image: postgres:16-alpine
    container_name: ctf-postgres-dev
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf_db_password_change_me
      POSTGRES_DB: ctf
    ports:
      - "5432:5432"          # exposed to the host so `npm run dev` can connect
    volumes:
      - ctf-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ctf-db-dev:
